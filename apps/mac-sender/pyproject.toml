[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homevault-sender"
version = "0.1.0"
description = "HomeVault macOS sender daemon and staging interface"
requires-python = ">=3.11"
dependencies = [
    "homevault-protocol",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
