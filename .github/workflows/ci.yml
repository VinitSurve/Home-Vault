name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-protocol:
    name: Test shared protocol
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/protocol[dev]"
          pip install -e "apps/mac-sender[dev]"
          pip install -e "apps/windows-agent[dev]"

      - name: Run all tests
        run: |
          PYTHONPATH="packages/protocol/src:apps/mac-sender/src:apps/windows-agent/src" python -m pytest packages/protocol/tests apps/mac-sender/tests apps/windows-agent/tests tests -v --tb=short
